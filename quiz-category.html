<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Practice — Peradian</title><link rel="icon" href="peradian-logo.png"><style>body{margin:0;background:#050304;color:#f5f2ee;font-family:Inter,Arial,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto}.nav{height:70px;border-bottom:1px solid #ffffff12;display:flex;align-items:center}.navin{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;color:#f5f2ee;text-decoration:none;font-weight:800;font-size:14px}.brand img{width:34px;height:34px;border-radius:9px}.back{color:#aaa;text-decoration:none;border:1px solid #ffffff20;padding:9px 13px;border-radius:999px;font-size:10px}.hero{text-align:center;padding:55px 0 30px}.eyebrow{font-size:9px;letter-spacing:1.5px;color:#ff7952}.hero h1{font-size:clamp(40px,7vw,68px);margin:15px 0 10px;letter-spacing:-4px}.hero h1 span{color:#aaa}.hero p{color:#928b87;font-size:13px}.category{border:1px solid #ffffff18;background:#ffffff06;border-radius:16px;padding:14px 16px;font-size:11px;font-weight:800;color:#ddd;margin-bottom:22px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}.level{border:1px solid #2a2224;background:#0c0809;border-radius:18px;padding:18px;text-align:left;color:#eee;cursor:pointer}.level.active{border-color:#ff6545;box-shadow:0 15px 40px #0008}.level b,.level small{display:block}.level small{color:#777;margin-top:6px;font-size:9px}.quiz{border:1px solid #ffffff18;background:#0b0809;border-radius:24px;padding:28px;margin-bottom:60px}.top{display:flex;justify-content:space-between;color:#ff7952;font-size:9px;letter-spacing:1.2px}.counter{color:#777;letter-spacing:0}.progress{height:5px;background:#21191b;border-radius:99px;margin:16px 0 26px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4928,#ff8b45);border-radius:99px}.question{font-size:25px;line-height:1.35}.options{display:grid;gap:10px}.option{border:1px solid #2b2426;background:#080607;color:#ddd;border-radius:14px;padding:15px;text-align:left;cursor:pointer}.correct{border-color:#62d39b!important;background:#133325!important}.wrong{border-color:#ff4934!important;background:#35120e!important}.feedback{min-height:24px;color:#aaa;font-size:11px;margin-top:14px}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.btn{border:1px solid #ffffff22;background:#ffffff08;color:#ddd;padding:11px 16px;border-radius:999px;font-size:10px;cursor:pointer}.primary{background:#ff522f;color:#fff;border:0}.hidden{display:none}.result{text-align:center}.score{font-size:70px;font-weight:850}.celebrate{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti{position:absolute;top:-20px;width:7px;height:13px;background:#ff7448;animation:fall 1.8s forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}@media(max-width:700px){.levels{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.wrap{width:calc(100% - 24px)}.quiz{padding:18px}.question{font-size:20px}.controls{flex-direction:column;gap:10px}.controls .btn{width:100%}}</style></head><body><nav class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="peradian-logo.png" alt="Peradian"><span>PERADIAN</span></a><a class="back" href="quiz.html">← Categories</a></div></nav><main class="wrap"><section class="hero"><div class="eyebrow">QUICK PRACTICE</div><h1 id="title">History <span>Challenge.</span></h1><p>Choose your difficulty and test what you know.</p></section><div class="category" id="category">🏛️ History</div><section class="levels"><button class="level active" data-level="1"><b>Level 1</b><small>Advanced</small></button><button class="level" data-level="2"><b>Level 2</b><small>Hard</small></button><button class="level" data-level="3"><b>Level 3</b><small>Expert</small></button><button class="level" data-level="4"><b>Level 4</b><small>Master</small></button></section><section class="quiz"><div class="top"><span id="levelLabel">LEVEL 1 · ADVANCED</span><span class="counter" id="counter">Question 1 / 4</span></div><div class="progress"><i id="progress"></i></div><div id="questionArea"><h2 class="question" id="question">Loading questions…</h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><span id="scoreText" style="color:#777;font-size:10px">Score: 0</span><button class="btn primary" id="next">Next question →</button></div></div><div class="result hidden" id="result"><div style="font-size:48px">🏆</div><div class="eyebrow">QUIZ COMPLETE</div><div class="score" id="finalScore">0/4</div><h2 id="resultTitle"></h2><p id="resultText" style="color:#999;font-size:12px"></p><button class="btn primary" id="restart">Practice again ↻</button></div></section></main><div class="celebrate" id="celebrate"></div><script src="quiz-levels.js"></script><script>
const names={history:'🏛️ History',science:'⚗️ Science',technology:'◈ Technology',geography:'◎ Geography',culture:'🎭 Culture',india:'✦ India',media:'⌁ Media Literacy',mixed:'✧ Mixed'};const p=new URLSearchParams(location.search);let cat=(p.get('category')||'history').toLowerCase();let level=1,idx=0,score=0,answered=false;const $=x=>document.getElementById(x);function valid(){return window.BANK&&BANK[cat]&&BANK[cat][level]&&BANK[cat][level].length}function render(){if(!valid()){$('question').textContent='Questions are temporarily unavailable.';return}const qs=BANK[cat][level],q=qs[idx];answered=false;$('counter').textContent=`Question ${idx+1} / ${qs.length}`;$('progress').style.width=((idx)/qs.length*100)+'%';$('question').textContent=q[0];$('feedback').textContent='';$('scoreText').textContent='Score: '+score;$('options').innerHTML=q[1].map((x,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}function start(){idx=0;score=0;$('questionArea').classList.remove('hidden');$('result').classList.add('hidden');$('levelLabel').textContent=`LEVEL ${level} · ${['','ADVANCED','HARD','EXPERT','MASTER'][level]}`;render()}function answer(i,b){if(answered)return;answered=true;const q=BANK[cat][level][idx];document.querySelectorAll('.option').forEach((x,n)=>{x.disabled=true;if(n===q[2])x.classList.add('correct')});if(i===q[2]){score++;$('feedback').textContent='Correct — excellent choice.'}else{b.classList.add('wrong');$('feedback').textContent='Not quite. Correct answer: '+q[1][q[2]]}$('scoreText').textContent='Score: '+score}function finish(){$('questionArea').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=score+'/'+BANK[cat][level].length;const perfect=score===BANK[cat][level].length;$('resultTitle').textContent=perfect?'Perfect run.':'Challenge complete.';$('resultText').textContent=perfect?'Every answer was correct. Outstanding work.':'You scored '+score+' out of '+BANK[cat][level].length+'. Try again or choose another level.';if(perfect)celebrate()}function celebrate(){const c=$('celebrate');c.innerHTML='';for(let i=0;i<70;i++){const x=document.createElement('i');x.className='confetti';x.style.left=Math.random()*100+'%';x.style.setProperty('--x',(Math.random()*260-130)+'px');x.style.animationDelay=Math.random()*.4+'s';c.appendChild(x)}}$('next').onclick=()=>{if(!answered)return;if(idx<BANK[cat][level].length-1){idx++;render()}else finish()};$('restart').onclick=start;document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{level=+b.dataset.level;document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');start()});$('title').innerHTML=(names[cat]||names.history)+' <span>Challenge.</span>';$('category').textContent=names[cat]||names.history;function boot(){start()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();</script></body></html>
