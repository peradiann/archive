<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Practice — Peradian</title><link rel="icon" href="peradian-logo.png"><style>:root{--bg:#050304;--card:#0b0809;--line:#ffffff18;--muted:#817974;--text:#f5f2ee;--accent:#ff5a35}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% 15%,#190b0d 0,#070405 38%,#050304 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(980px,calc(100% - 32px));margin:auto}.nav{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;background:#050304cc;backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.navin{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;color:#f5f2ee;text-decoration:none;font-weight:800;font-size:14px;letter-spacing:.4px}.brand img{width:36px;height:36px;border-radius:10px}.back{color:#aaa;text-decoration:none;border:1px solid #ffffff20;padding:10px 15px;border-radius:999px;font-size:10px;transition:.2s}.back:hover{color:#fff;border-color:#ffffff38}.hero{text-align:center;padding:58px 0 34px}.eyebrow{font-size:9px;letter-spacing:2px;color:#ff7952;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.96;letter-spacing:-5px;margin:16px 0 14px}.hero h1 span{color:#aaa}.hero p{color:#918984;font-size:13px;margin:0}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 26px}.categories .category{appearance:none;border:1px solid #ffffff16;background:linear-gradient(145deg,#0d090a,#090607);border-radius:18px;padding:16px;text-align:left;color:#ddd;cursor:pointer;min-height:82px;transition:.22s}.categories .category:hover,.categories .category.active{border-color:#ff6545;transform:translateY(-2px);box-shadow:0 16px 45px #0008,0 0 30px #ff4a260d}.categories .icon{font-size:18px;margin-bottom:8px}.categories b{display:block;font-size:12px}.categories small{display:block;color:#706965;font-size:8px;margin-top:5px}.quiz{border:1px solid var(--line);background:linear-gradient(145deg,#0d090a,#090607);border-radius:26px;padding:28px;margin:0 0 70px;box-shadow:0 25px 80px #0005}.top{display:flex;justify-content:space-between;gap:15px;color:#ff7952;font-size:9px;letter-spacing:1.6px;text-transform:uppercase}.counter{color:#777;letter-spacing:0;text-transform:none}.progress{height:5px;background:#21191b;border-radius:99px;margin:16px 0 30px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4928,#ff8b45);border-radius:99px;transition:width .3s}.question{font-size:clamp(23px,4vw,34px);line-height:1.25;letter-spacing:-1px;margin:0 0 24px}.options{display:grid;gap:10px}.option{width:100%;border:1px solid #2b2426;background:#080607;color:#ddd;border-radius:15px;padding:16px;text-align:left;cursor:pointer;font:inherit;font-size:13px;transition:.18s}.option:hover:not(:disabled){border-color:#ff6545;background:#120a0a;transform:translateY(-1px)}.option:disabled{cursor:default}.correct{border-color:#62d39b!important;background:#133325!important}.wrong{border-color:#ff4934!important;background:#35120e!important}.feedback{min-height:28px;color:#aaa;font-size:11px;margin-top:14px}.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:18px}.btn{border:1px solid #ffffff22;background:#ffffff08;color:#ddd;padding:12px 17px;border-radius:999px;font-size:10px;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.primary{background:#ff522f;color:#fff;border:0}.hidden{display:none!important}.result{text-align:center;padding:35px 10px}.result .score{font-size:clamp(58px,12vw,90px);font-weight:900;letter-spacing:-5px;margin:10px 0}.result h2{font-size:26px;margin:8px 0}.result p{color:#999;font-size:12px;line-height:1.7;max-width:560px;margin:0 auto 22px}.celebrate{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.confetti{position:absolute;top:-20px;width:7px;height:13px;animation:fall 1.8s forwards;border-radius:2px}.spark{position:absolute;inset:0;display:grid;place-items:center;font-size:90px;animation:pop 1.3s forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}@keyframes pop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}@media(max-width:760px){.wrap{width:calc(100% - 24px)}.categories{grid-template-columns:repeat(2,1fr)}.hero{padding:42px 0 28px}.hero h1{letter-spacing:-3px}.quiz{padding:20px;border-radius:22px}.controls{flex-direction:column;align-items:stretch}.controls .btn{width:100%}}@media(max-width:430px){.categories{grid-template-columns:1fr}.categories .category{min-height:72px}.hero h1{font-size:42px}.quiz{padding:17px}.question{font-size:22px}}</style></head><body><nav class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="peradian-logo.png" alt="Peradian"><span>PERADIAN</span></a><a class="back" href="quiz.html">← Back to Quiz</a></div></nav><main class="wrap"><section class="hero"><div class="eyebrow">Quick Practice · Peradian</div><h1>Test your <span>thinking.</span></h1><p>Choose a category, select a level, and challenge yourself.</p></section><section class="categories" aria-label="Quiz categories"></section><section class="quiz"><div class="top"><span id="categoryLabel">History · Level 1</span><span class="counter" id="counter">Question 1 / 4</span></div><div class="progress"><i id="progress"></i></div><div id="questionArea"><h2 class="question" id="question">Loading questions…</h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><span id="scoreText" style="color:#777;font-size:10px">Score: 0</span><button class="btn primary" id="next" disabled>Next question →</button></div></div><div class="result hidden" id="result"><div id="trophy" style="font-size:48px">🏆</div><div class="eyebrow">Quiz complete</div><div class="score" id="finalScore">0/4</div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="btn primary" id="restart">Practice again ↻</button></div></section></main><div class="celebrate" id="celebrate"></div><script src="quiz-levels.js"></script><script>window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{const wanted=(new URLSearchParams(location.search).get('category')||'').toLowerCase();if(!wanted)return;const button=document.querySelector('.categories .category[data-cat="'+wanted+'"]');if(button)button.click()},0)},{once:true});</script></body></html>
