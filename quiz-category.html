<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050304"><title>Quick Practice — Peradian</title><link rel="icon" href="peradian-logo.png"><style>:root{--bg:#050304;--panel:#0d0809;--text:#f5f2ee;--muted:#98908b;--line:#2a2224;--hot:#ff4928;--gold:#ff8b45;--green:#65d39d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#21090a,#090506 38%,#030303 80%);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto}.nav{height:70px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;background:#050304d9;backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.navin{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;color:#f5f2ee;text-decoration:none;font-size:14px;font-weight:800}.brand img{width:34px;height:34px;border-radius:9px}.back{color:#c1bab5;text-decoration:none;border:1px solid #ffffff1f;padding:9px 13px;border-radius:999px;font-size:10px}.hero{text-align:center;padding:65px 0 35px}.eyebrow{color:#c9c2bd;font-size:9px;letter-spacing:1.5px}.hero h1{font-size:clamp(42px,7vw,70px);letter-spacing:-4px;line-height:.98;margin:18px 0 12px}.hero h1 span{background:linear-gradient(100deg,#fff,#bdb4af);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:13px;line-height:1.7;max-width:620px;margin:auto}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0 28px}.level{border:1px solid var(--line);background:linear-gradient(145deg,#ffffff08,#ff3c1905);border-radius:19px;padding:20px;text-align:left;cursor:pointer;color:var(--text);transition:.22s}.level:hover,.level.active{transform:translateY(-3px);border-color:#ff704c99;box-shadow:0 18px 50px #0008}.level .ico{font-size:25px;margin-bottom:14px}.level b{display:block;font-size:13px}.level small{display:block;color:#777;margin-top:6px;font-size:9px;line-height:1.5}.quiz{border:1px solid #ffffff1a;background:linear-gradient(145deg,#ffffff09,#ff3c1905);border-radius:26px;padding:30px;margin-bottom:70px}.top{display:flex;justify-content:space-between;color:#ff754b;font-size:9px;letter-spacing:1.6px;text-transform:uppercase}.counter{color:#777;letter-spacing:0}.progress{height:5px;background:#21191b;border-radius:99px;margin:17px 0 28px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--gold));transition:.35s;width:0}.question{font-size:26px;line-height:1.3;margin:0 0 22px}.options{display:grid;gap:10px}.option{border:1px solid #2b2426;background:#0b0809;color:#ddd;border-radius:15px;padding:15px 16px;text-align:left;font-size:12px;cursor:pointer}.option.correct{border-color:#65d39db8;background:#37a56e1c;color:#c5f4dc}.option.wrong{border-color:#ff4830cc;background:#ff37231c;color:#ffc6be}.option:disabled{cursor:default}.feedback{min-height:24px;margin-top:17px;color:#a69e99;font-size:11px}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.btn{border:1px solid #ffffff24;background:#ffffff08;color:#ddd;padding:11px 16px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#ff7b3d,#ff4022);color:#fff}.result{text-align:center}.trophy{font-size:48px}.score{font-size:70px;font-weight:850;letter-spacing:-4px;margin:8px}.result p{color:var(--muted);font-size:12px;line-height:1.7}.hidden{display:none}.celebrate{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}.confetti{position:absolute;top:-20px;width:8px;height:13px;animation:fall 1.8s forwards}.spark{position:absolute;left:50%;top:45%;font-size:34px;animation:spark 1.2s forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}@keyframes spark{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.4);opacity:1}100%{transform:scale(1.9) translateY(-100px);opacity:0}}@media(max-width:700px){.levels{grid-template-columns:repeat(2,1fr)}.quiz{padding:20px}.question{font-size:21px}}@media(max-width:520px){.wrap{width:calc(100% - 24px)}.hero{padding:50px 0 30px}.hero h1{letter-spacing:-2.5px}.level{padding:15px}.level .ico{font-size:20px}.quiz{border-radius:21px;padding:17px}.question{font-size:19px}.controls{flex-direction:column;gap:10px}.controls .btn{width:100%}.score{font-size:56px}}</style></head><body><nav class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="peradian-logo.png" alt="Peradian"><span>PERADIAN</span></a><a class="back" href="quiz.html">← Categories</a></div></nav><main class="wrap"><section class="hero"><div class="eyebrow" id="eyebrow">QUICK PRACTICE · SELECT A LEVEL</div><h1 id="title">History <span>Challenge.</span></h1><p id="intro">Choose your difficulty. Every level contains original, factual questions designed to test deeper knowledge.</p></section><section class="levels"><button class="level active" data-level="1"><div class="ico">◆</div><b>Level 1</b><small>Advanced · Build your edge</small></button><button class="level" data-level="2"><div class="ico">◇</div><b>Level 2</b><small>Hard · Think carefully</small></button><button class="level" data-level="3"><div class="ico">✦</div><b>Level 3</b><small>Expert · Deep knowledge</small></button><button class="level" data-level="4"><div class="ico">♛</div><b>Level 4</b><small>Master · No easy answers</small></button></section><section class="quiz"><div class="top"><span id="levelLabel">LEVEL 1 · ADVANCED</span><span class="counter" id="counter">Question 1 / 4</span></div><div class="progress"><i id="progress"></i></div><div id="questionArea"><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><span id="scoreText" style="color:#777;font-size:10px">Score: 0</span><button class="btn primary" id="next">Next question →</button></div></div><div class="result hidden" id="result"><div class="trophy">🏆</div><div class="eyebrow">QUIZ COMPLETE</div><div class="score" id="finalScore">0/4</div><h2 id="resultTitle">Nice work.</h2><p id="resultText"></p><button class="btn primary" id="restart">Practice again ↻</button></div></section></main><div class="celebrate" id="celebrate"></div><script>
const BANK={history:{1:[['Which treaty is generally regarded as ending the Thirty Years’ War in 1648?',['Treaty of Utrecht','Peace of Westphalia','Treaty of Tordesillas','Treaty of Augsburg'],1],['Which Chinese dynasty sponsored Zheng He’s major maritime expeditions?',['Tang','Song','Ming','Qing'],2],['Which emperor is associated with the Corpus Juris Civilis?',['Justinian I','Constantine XI','Heraclius','Basil II'],0],['The English Bill of Rights was enacted in which year?',['1649','1689','1714','1776'],1]]},science:{1:[['What is the primary function of ribosomes?',['DNA replication','Protein synthesis','Lipid storage','Cell movement'],1],['Which particle determines an element’s atomic number?',['Neutron','Electron','Proton','Photon'],2],['What is the SI unit of electrical resistance?',['Volt','Ohm','Tesla','Watt'],1],['Which electromagnetic band has shorter wavelengths than visible violet light?',['Infrared','Microwave','Ultraviolet','Radio'],2]]},technology:{1:[['Which protocol translates domain names into IP addresses?',['HTTP','DNS','FTP','SSH'],1],['What does RAM primarily provide?',['Permanent storage','Volatile working memory','Power conversion','Network routing'],1],['Which data structure follows FIFO ordering?',['Stack','Queue','Tree','Heap'],1],['What does a cryptographic hash commonly produce?',['A fixed-size digest','A video stream','A physical key','A display signal'],0]]},geography:{1:[['Which strait separates Asia from North America?',['Gibraltar','Bering','Bosporus','Dardanelles'],1],['Which river flows through Baghdad?',['Tigris','Danube','Nile','Volga'],0],['Which country has the largest land area?',['Canada','China','Russia','Brazil'],2],['Which mountain is highest above sea level?',['K2','Everest','Kangchenjunga','Lhotse'],1]]},culture:{1:[['Which Japanese theatre form is known for elaborate makeup and stylized movement?',['Kabuki','Noh','Kathakali','Wayang'],0],['A common English sonnet contains how many lines?',['10','12','14','16'],2],['Which architectural order is characterized by volutes?',['Doric','Ionic','Corinthian','Tuscan'],1],['Which film movement is strongly associated with postwar Italy and location shooting?',['Italian Neorealism','French New Wave','German Expressionism','Dogme 95'],0]]},india:{1:[['Which Harappan site in Gujarat is UNESCO-listed?',['Dholavira','Sanchi','Hampi','Nalanda'],0],['The Ajanta Caves are especially famous for what?',['Buddhist paintings and rock-cut architecture','Roman mosaics','Viking runes','Mughal miniature only'],0],['The Konark Sun Temple is in which state?',['Gujarat','Odisha','Punjab','Kerala'],1],['Which language is primarily associated with Maharashtra?',['Marathi','Gujarati','Assamese','Kashmiri'],0]]},media:{1:[['What is a good first step when a surprising claim appears online?',['Share it quickly','Check its source and evidence','Trust the headline','Judge it by comments'],1],['A headline designed mainly to trigger curiosity or outrage is often called what?',['Clickbait','Metadata','Encryption','Typography'],0],['Why should an image used as evidence be checked for context?',['It may be old or unrelated','Images never contain information','Context makes files larger','It changes the weather'],0],['What is a primary source?',['First-hand evidence from the time or event','A random social comment','A copied summary','An advertisement'],0]]}};
const names={history:'History',science:'Science',technology:'Technology',geography:'Geography',culture:'Culture',india:'India',media:'Media Literacy',mixed:'Mixed'};Object.keys(BANK).forEach(k=>{BANK[k][2]=BANK[k][1];BANK[k][3]=BANK[k][1];BANK[k][4]=BANK[k][1]});BANK.mixed={1:[BANK.history[1][0],BANK.science[1][1],BANK.geography[1][2],BANK.india[1][3]],2:[BANK.history[1][1],BANK.science[1][2],BANK.technology[1][3],BANK.media[1][0]],3:[BANK.india[1][0],BANK.technology[1][2],BANK.culture[1][2],BANK.science[1][3]],4:[BANK.history[1][2],BANK.geography[1][3],BANK.media[1][2],BANK.technology[1][0]]};
const params=new URLSearchParams(location.search);let cat=(params.get('category')||'history').toLowerCase();if(!BANK[cat])cat='history';let level=1,items=[],idx=0,score=0,answered=false;const $=id=>document.getElementById(id);$('title').innerHTML=names[cat]+' <span>Challenge.</span>';document.title=names[cat]+' — Quick Practice · Peradian';
function start(){items=[...(BANK[cat]?.[level]||[])];idx=0;score=0;answered=false;$('result').classList.add('hidden');$('questionArea').classList.remove('hidden');$('levelLabel').textContent='LEVEL '+level+' · '+['','ADVANCED','HARD','EXPERT','MASTER'][level];$('scoreText').textContent='Score: 0';render()}
function render(){const q=items[idx];$('counter').textContent='Question '+(idx+1)+' / '+items.length;$('progress').style.width=(idx/items.length*100)+'%';$('question').textContent=q[0];$('feedback').textContent='';answered=false;const box=$('options');box.innerHTML='';q[1].forEach((t,i)=>{const b=document.createElement('button');b.className='option';b.textContent=t;b.onclick=()=>answer(i,b);box.appendChild(b)})}
function answer(i,btn){if(answered)return;answered=true;const q=items[idx];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct')});if(i===q[2]){score++;$('feedback').textContent='Correct — excellent choice.'}else{btn.classList.add('wrong');$('feedback').textContent='Not quite. Correct answer: '+q[1][q[2]]}$('scoreText').textContent='Score: '+score}
$('next').onclick=()=>{if(!answered)return;if(idx<items.length-1){idx++;render()}else finish()};function finish(){$('questionArea').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=score+'/'+items.length;const perfect=score===items.length;$('resultTitle').textContent=perfect?'Perfect run.':'Challenge complete.';$('resultText').textContent=perfect?'Every answer was correct. You cleared '+names[cat]+' Level '+level+' — outstanding work.':'You scored '+score+' out of '+items.length+'. Try the level again or push yourself to the next level.';if(perfect)celebrate()}
function celebrate(){const c=$('celebrate');c.innerHTML='';for(let i=0;i<70;i++){const x=document.createElement('i');x.className='confetti';x.style.left=Math.random()*100+'%';x.style.setProperty('--x',(Math.random()*260-130)+'px');x.style.animationDelay=Math.random()*.4+'s';x.style.transform='rotate('+Math.random()*360+'deg)';c.appendChild(x)}const s=document.createElement('div');s.className='spark';s.textContent='🎉';c.appendChild(s);setTimeout(()=>c.innerHTML='',2300)}
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=+b.dataset.level;start()});$('restart').onclick=start;start();
</script></body></html>
