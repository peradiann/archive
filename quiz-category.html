<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050304"><title>Quick Practice — Peradian</title><link rel="icon" href="peradian-logo.png"><style>:root{--bg:#050304;--text:#f5f2ee;--muted:#98908b;--line:#2a2224;--hot:#ff4928;--gold:#ff8b45}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#21090a,#090506 38%,#030303 80%);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto}.nav{height:70px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;background:#050304d9;backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.navin{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;color:#f5f2ee;text-decoration:none;font-size:14px;font-weight:800}.brand img{width:34px;height:34px;border-radius:9px}.back{color:#c1bab5;text-decoration:none;border:1px solid #ffffff1f;padding:9px 13px;border-radius:999px;font-size:10px}.hero{text-align:center;padding:65px 0 35px}.eyebrow{color:#c9c2bd;font-size:9px;letter-spacing:1.5px}.hero h1{font-size:clamp(42px,7vw,70px);letter-spacing:-4px;line-height:.98;margin:18px 0 12px}.hero h1 span{background:linear-gradient(100deg,#fff,#bdb4af);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:13px;line-height:1.7;max-width:620px;margin:auto}.categoryBar{display:flex;align-items:center;gap:10px;margin:0 0 24px}.categoryBadge{flex:1;border:1px solid #ffffff18;background:#ffffff07;border-radius:16px;padding:13px 16px;color:#ddd;font-size:11px;font-weight:800}.change{border:1px solid #ffffff24;background:#ffffff08;color:#aaa;padding:12px 14px;border-radius:999px;font-size:9px;text-decoration:none}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 28px}.level{border:1px solid var(--line);background:linear-gradient(145deg,#ffffff08,#ff3c1905);border-radius:19px;padding:20px;text-align:left;cursor:pointer;color:var(--text);transition:.22s}.level:hover,.level.active{transform:translateY(-3px);border-color:#ff704c99;box-shadow:0 18px 50px #0008}.level .ico{font-size:25px;margin-bottom:14px}.level b{display:block;font-size:13px}.level small{display:block;color:#777;margin-top:6px;font-size:9px;line-height:1.5}.quiz{border:1px solid #ffffff1a;background:linear-gradient(145deg,#ffffff09,#ff3c1905);border-radius:26px;padding:30px;margin-bottom:70px}.top{display:flex;justify-content:space-between;color:#ff754b;font-size:9px;letter-spacing:1.6px;text-transform:uppercase}.counter{color:#777;letter-spacing:0}.progress{height:5px;background:#21191b;border-radius:99px;margin:17px 0 28px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--gold));transition:.35s;width:0}.question{font-size:26px;line-height:1.3;margin:0 0 22px}.options{display:grid;gap:10px}.option{border:1px solid #2b2426;background:#0b0809;color:#ddd;border-radius:15px;padding:15px 16px;text-align:left;font-size:12px;cursor:pointer}.option.correct{border-color:#65d39db8;background:#37a56e1c;color:#c5f4dc}.option.wrong{border-color:#ff4830cc;background:#ff37231c;color:#ffc6be}.option:disabled{cursor:default}.feedback{min-height:24px;margin-top:17px;color:#a69e99;font-size:11px}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.btn{border:1px solid #ffffff24;background:#ffffff08;color:#ddd;padding:11px 16px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#ff7b3d,#ff4022);color:#fff}.result{text-align:center}.trophy{font-size:48px}.score{font-size:70px;font-weight:850;letter-spacing:-4px;margin:8px}.result p{color:var(--muted);font-size:12px;line-height:1.7}.hidden{display:none}.celebrate{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}.confetti{position:absolute;top:-20px;width:8px;height:13px;background:#ff7448;animation:fall 1.8s forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}@media(max-width:700px){.levels{grid-template-columns:repeat(2,1fr)}.quiz{padding:20px}.question{font-size:21px}}@media(max-width:520px){.wrap{width:calc(100% - 24px)}.hero{padding:50px 0 30px}.hero h1{letter-spacing:-2.5px}.level{padding:15px}.quiz{border-radius:21px;padding:17px}.question{font-size:19px}.controls{flex-direction:column;gap:10px}.controls .btn{width:100%}.score{font-size:56px}}</style></head><body><nav class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="peradian-logo.png" alt="Peradian"><span>PERADIAN</span></a><a class="back" href="quiz.html">← Categories</a></div></nav><main class="wrap"><section class="hero"><div class="eyebrow">QUICK PRACTICE · CATEGORY CHALLENGE</div><h1 id="title">History <span>Challenge.</span></h1><p>Choose a difficulty below. Every level contains original, factual questions designed to test deeper knowledge.</p></section><div class="categoryBar"><div class="categoryBadge" id="categoryBadge">🏛️ History</div><a class="change" href="quiz.html">Change category</a></div><section class="levels"><button class="level active" data-level="1"><div class="ico">◆</div><b>Level 1</b><small>Advanced · Build your edge</small></button><button class="level" data-level="2"><div class="ico">◇</div><b>Level 2</b><small>Hard · Think carefully</small></button><button class="level" data-level="3"><div class="ico">✦</div><b>Level 3</b><small>Expert · Deep knowledge</small></button><button class="level" data-level="4"><div class="ico">♛</div><b>Level 4</b><small>Master · No easy answers</small></button></section><section class="quiz"><div class="top"><span id="levelLabel">LEVEL 1 · ADVANCED</span><span class="counter" id="counter">Question 1 / 4</span></div><div class="progress"><i id="progress"></i></div><div id="questionArea"><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><span id="scoreText" style="color:#777;font-size:10px">Score: 0</span><button class="btn primary" id="next">Next question →</button></div></div><div class="result hidden" id="result"><div class="trophy">🏆</div><div class="eyebrow">QUIZ COMPLETE</div><div class="score" id="finalScore">0/4</div><h2 id="resultTitle">Nice work.</h2><p id="resultText"></p><button class="btn primary" id="restart">Practice again ↻</button></div></section></main><div class="celebrate" id="celebrate"></div><script src="quiz-levels.js"></script><script>
const names={history:'🏛️ History',science:'⚗️ Science',technology:'◈ Technology',geography:'◎ Geography',culture:'🎭 Culture',india:'✦ India',media:'⌁ Media Literacy',mixed:'✧ Mixed'};const params=new URLSearchParams(location.search);let cat=(params.get('category')||'history').toLowerCase();if(!window.BANK||!BANK[cat])cat='history';let level=1,items=[],idx=0,score=0,answered=false;const $=id=>document.getElementById(id);$('title').innerHTML=names[cat]+' <span>Challenge.</span>';$('categoryBadge').textContent=names[cat];document.title=names[cat]+' — Quick Practice · Peradian';
function start(){items=[...(BANK[cat]?.[level]||[])];idx=0;score=0;answered=false;$('result').classList.add('hidden');$('questionArea').classList.remove('hidden');$('levelLabel').textContent='LEVEL '+level+' · '+['','ADVANCED','HARD','EXPERT','MASTER'][level];$('scoreText').textContent='Score: 0';render()}function render(){const q=items[idx];$('counter').textContent='Question '+(idx+1)+' / '+items.length;$('progress').style.width=(idx/items.length*100)+'%';$('question').textContent=q[0];$('feedback').textContent='';answered=false;const box=$('options');box.innerHTML='';q[1].forEach((t,i)=>{const b=document.createElement('button');b.className='option';b.textContent=t;b.onclick=()=>answer(i,b);box.appendChild(b)})}function answer(i,btn){if(answered)return;answered=true;const q=items[idx];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct')});if(i===q[2]){score++;$('feedback').textContent='Correct — excellent choice.'}else{btn.classList.add('wrong');$('feedback').textContent='Not quite. Correct answer: '+q[1][q[2]]}$('scoreText').textContent='Score: '+score}function finish(){$('questionArea').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=score+'/'+items.length;const perfect=score===items.length;$('resultTitle').textContent=perfect?'Perfect run.':'Challenge complete.';$('resultText').textContent=perfect?'Every answer was correct. You cleared '+names[cat]+' Level '+level+' — outstanding work.':'You scored '+score+' out of '+items.length+'. Try the level again or push yourself to the next level.';if(perfect)celebrate()}function celebrate(){const c=$('celebrate');c.innerHTML='';for(let i=0;i<70;i++){const x=document.createElement('i');x.className='confetti';x.style.left=Math.random()*100+'%';x.style.setProperty('--x',(Math.random()*260-130)+'px');x.style.animationDelay=Math.random()*.4+'s';c.appendChild(x)}}$('next').onclick=()=>{if(!answered)return;if(idx<items.length-1){idx++;render()}else finish()};$('restart').onclick=start;document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=+b.dataset.level;start()});start();</script></body></html>
