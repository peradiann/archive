952;font-size:9px;letter-spacing:1.6px;text-transform:uppercase}.counter{color:#777;letter-spacing:0;text-transform:none}.progress{height:5px;background:#21191b;border-radius:99px;margin:16px 0 30px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--gold));transition:.3s}.question{font-size:clamp(23px,4vw,34px);line-height:1.25;letter-spacing:-1px;margin:0 0 24px}.options{display:grid;gap:10px}.option{width:100%;border:1px solid #2b2426;background:#080607;color:#ddd;border-radius:15px;padding:16px;text-align:left;cursor:pointer;font:inherit;font-size:13px}.option:hover:not(:disabled){border-color:#ff6545;background:#120a0a}.option:disabled{cursor:default}.correct{border-color:#62d39b!important;background:#133325!important}.wrong{border-color:#ff4934!important;background:#35120e!important}.feedback{min-height:28px;color:#aaa;font-size:11px;margin-top:14px}.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:18px}.btn{border:1px solid #ffffff22;background:#ffffff08;color:#ddd;padding:12px 17px;border-radius:999px;font-size:10px;cursor:pointer}.primary{background:linear-gradient(135deg,#ff7b3d,#ff4022);border:0;color:#fff}.hidden{display:none!important}.result{text-align:center;padding:35px 10px}.score{font-size:clamp(58px,12vw,90px);font-weight:900;letter-spacing:-5px;margin:10px 0}.result h2{font-size:26px}.result p{color:#999;font-size:12px;line-height:1.7;max-width:560px;margin:0 auto 22px}.celebrate{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.confetti{position:absolute;top:-20px;width:7px;height:13px;background:#ff7b3d;animation:fall 1.8s forwards}.spark{position:absolute;inset:0;display:grid;place-items:center;font-size:90px;animation:pop 1.3s forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}@keyframes pop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.2);opacity:1}100%{transform:scale(
