name: Inject Peradian AI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Peradian AI and branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          head = '''<link rel="icon" type="image/png" href="peradian-logo.png"><link rel="shortcut icon" type="image/png" href="peradian-logo.png"><link rel="apple-touch-icon" href="peradian-logo.png"><meta name="theme-color" content="#050304"><meta property="og:title" content="Peradian Resources — Documentary Research Archive"><meta property="og:description" content="Explore the research, sources and stories behind Peradian documentaries."><meta property="og:image" content="https://peradiann.github.io/archive/peradian-logo.png"><meta property="og:type" content="website"><meta property="og:url" content="https://peradiann.github.io/archive/">'''
          if 'href="peradian-logo.png"' not in s:
              s = s.replace('</head>', head + '</head>', 1)
          for tag in ['<script src="peradian-ai.js"></script>', '<script src="peradian-branding.js"></script>']:
              if tag not in s:
                  s = s.replace('</body>', tag + '</body>', 1)
          s = s.replace('rrdobhal081-blip.github.io/archive', 'peradiann.github.io/archive')

          old_submit = "suggestForm.addEventListener('submit',()=>{setTimeout(()=>{"
          new_submit = "suggestForm.addEventListener('submit',async e=>{e.preventDefault();const submitBtn=document.getElementById('suggestSubmit');if(submitBtn)submitBtn.disabled=true;try{await fetch(suggestForm.action,{method:'POST',body:new FormData(suggestForm),mode:'no-cors',keepalive:true})}catch(err){}setTimeout(()=>{"
          if old_submit in s and 'e.preventDefault();const submitBtn=document.getElementById(\'suggestSubmit\')' not in s:
              s = s.replace(old_submit, new_submit, 1)

          old_again = "document.getElementById('thankClose').addEventListener('click',()=>{thankyou.classList.remove('show');suggestForm.classList.remove('hide');suggestForm.reset();topicInput.focus()})"
          new_again = "document.getElementById('thankClose').addEventListener('click',()=>{thankyou.classList.remove('show');suggestForm.classList.remove('hide');suggestForm.reset();const submitBtn=document.getElementById('suggestSubmit');if(submitBtn)submitBtn.disabled=false;topicInput.focus()})"
          if old_again in s and 'submitBtn=document.getElementById(\'suggestSubmit\');if(submitBtn)submitBtn.disabled=false' not in s:
              s = s.replace(old_again, new_again, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit injected branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No injection needed"
            exit 0
          fi
          git commit -m "Fix topic suggestion redirect [skip ci]"
          git push
