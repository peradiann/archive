name: Activate Peradian AI Fixed Runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate fixed AI runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="peradian-ai-fixed.js"></script>'
          if tag not in s:
              s = s.replace('<script src="peradian-branding.js"></script>', '<script src="peradian-branding.js"></script>'+tag, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "AI runtime already active"
            exit 0
          fi
          git commit -m "Activate fixed Peradian AI runtime"
          git push
