or:#ff7952;font-size:9px;letter-spacing:1.6px;text-transform:uppercase}.counter{color:#777;letter-spacing:0;text-transform:none}.progress{height:5px;background:#21191b;border-radius:99px;margin:16px 0 30px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--gold));transition:.3s}.question{font-size:clamp(23px,4vw,34px);line-height:1.25;letter-spacing:-1px;margin:0 0 24px}.options{display:grid;gap:10px}.option{width:100%;border:1px solid #2b2426;background:#080607;color:#ddd;border-radius:15px;padding:16px;text-align:left;cursor:pointer;font:inherit;font-size:13px}.option:hover:not(:disabled){border-color:#ff6545;background:#120a0a}.option:disabled{cursor:default}.correct{border-color:#62d39b!important;background:#133325!important}.wrong{border-color:#ff4934!important;background:#35120e!important}.feedback{min-height:28px;color:#aaa;font-size:11px;margin-top:14px}.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:18px}.btn{border:1px solid #ffffff22;background:#ffffff08;color:#ddd;padding:12px 17px;border-radius:999px;font-size:10px;cursor:pointer}.primary{background:linear-gradient(135deg,#ff7b3d,#ff4022);border:0;color:#fff}.hidden{display:none!important}.result{text-align:center;padding:35px 10px}.score{font-size:clamp(58px,12vw,90px);font-weight:900;letter-spacing:-5px;margin:10px 0}.result h2{font-size:26px}.result p{color:#999;font-size:12px;line-height:1.7;max-width:560px;margin:0 auto 22px}.celebrate{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.confetti{position:absolute;top:-20px;width:7px;height:13px;background:#ff7b3d;animation:fall 1.8s forwards}.spark{position:absolute;inset:0;display:grid;place-items:center;font-size:90px;animation:pop 1.3s forwards}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}@keyframes pop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}@media(max-width:760px){.levels{grid-template-columns:repeat(2,1fr)}.quiz{padding:20px}.controls{flex-direction:column;align-items:stretch}.controls .btn{width:100%}}@media(max-width:430px){.wrap{width:calc(100% - 24px)}.levels{grid-template-columns:1fr}.hero h1{letter-spacing:-3px}.quiz{padding:17px}}</style></head><body><nav class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="peradian-logo.png" alt="Peradian"><span>PERADIAN</span></a><a class="back" id="back" href="quiz.html">← Back to Quiz</a></div></nav><main class="wrap"><section class="hero"><div class="eyebrow">Quick Practice · Peradian</div><h1><span id="icon">⌁</span> <span id="title">Media Literacy</span></h1><p>Choose a level and test how carefully you evaluate information.</p></section><section class="levels"><button class="level active"><b>Level 1</b><small>Advanced</small></button><button class="level"><b>Level 2</b><small>Hard</small></button><button class="level"><b>Level 3</b><small>Expert</small></button><button class="level"><b>Level 4</b><small>Master</small></button></section><section class="quiz"><div class="top"><span id="levelLabel">LEVEL 1 · ADVANCED</span><span class="counter" id="counter"></span></div><div class="progress"><i id="progress"></i></div><div id="questionArea"><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><span id="score" style="color:#777;font-size:10px">Score: 0</span><button class="btn primary" id="next" disabled>Next question →</button></div></div><div class="result hidden" id="result"><div style="font-size:48px">🏆</div><div class="eyebrow">Quiz complete</div><div class="score" id="finalScore"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="btn primary" id="restart">Practice again ↻</button></div></section></main><div class="celebrate" id="celebrate"></div><script>window.QUIZ_DATA={title:'Media Literacy',icon:'⌁',questions:{1:[['What is the best first step when a surprising claim appears online?',['Share it quickly','Check its source and evidence','Trust the headline','Judge it by comments'],1],['A headline designed mainly to trigger curiosity or outrage is often called what?',['Clickbait','Metadata','Encryption','Typography'],0],['Why should an image used as evidence be checked for context?',['It may be old or unrelated','Images contain no information','Context makes files larger','It changes the weather'],0],['What is the difference between a fact and an opinion?',['A fact is testable against evidence; an opinion expresses a judgment','Facts are always popular','Opinions can never be supported','There is no difference'],0]],2:[['Why is lateral reading useful when evaluating an unfamiliar website?',['You leave the site to check other credible sources','You read every sentence twice','You disable the browser','You inspect only the logo'],0],['What is source laundering?',['Presenting information through a seemingly independent source while hiding weak provenance','Encrypting a source','Translating an article','Removing ads'],0],['A study claims a causal effect but its methods show only correlation. What is the main concern?',['The conclusion may overstate the evidence','The font is too small','The sample must be perfect','Correlation always proves causation'],0],['Why should publication date matter when checking a claim?',['Evidence and circumstances can change over time','Older sources are always false','Newer sources are always true','Dates only matter for photographs'],0]],3:[['What does cherry-picking evidence mean?',['Selecting supporting evidence while ignoring relevant contradictory evidence','Using multiple independent sources','Checking original documents','Correcting a typo'],0],['Which source is generally strongest for verifying what a government agency officially announced?',['The agency’s primary statement or document','An anonymous meme','A random comment','An unattributed repost'],0],['What does a correction from a publisher most strongly signal?',['A willingness to acknowledge and repair an error','That every article is false','That sources are unnecessary','That headlines are always accurate'],0],['What is a primary source in journalism or research?',['Original evidence or a direct record of an event','A summary copied from another article','A reaction meme','A comment thread'],0]],4:[['Why is a strong claim with no named evidence a warning sign?',['It is difficult to independently verify','It must be true','It proves expertise','It guarantees neutrality'],0],['What is the purpose of checking a claim against multiple independent sources?',['To reduce dependence on one source and identify disagreement','To make the claim longer','To avoid reading evidence','To guarantee the claim is popular'],0],['If two outlets repeat the same false claim from one original post, what should you avoid assuming?',['That repetition makes the claim independently verified','That the wording is identical','That the outlets published it','That the claim exists online'],0],['What is the most defensible response when evidence is incomplete?',['State what is known, what is uncertain, and what evidence is missing','Fill the gaps with assumptions','Choose the most dramatic explanation','Present uncertainty as certainty'],0]]}};</script><script src="quiz-category-engine.js"></script></body></html>
