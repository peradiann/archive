<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Peradian Quiz — practice original questions across history, science, technology, geography and culture."><meta name="theme-color" content="#050304"><title>Peradian Quiz — Practice & Learn</title><link rel="icon" type="image/png" href="peradian-logo.png"><style>
:root{--bg:#050304;--panel:#0c0809;--panel2:#110b0c;--text:#f5f2ee;--muted:#9a928d;--line:#292124;--red:#ff3d24;--orange:#ff742d;--green:#63d39b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% 8%,#1a0809 0,#080506 36%,#030303 78%);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif;min-height:100vh}a{color:inherit}.wrap{width:min(1100px,calc(100% - 36px));margin:auto}.nav{position:sticky;top:0;z-index:20;background:rgba(5,3,4,.78);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}.navin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:15px}.brand img{width:34px;height:34px;border-radius:9px}.back{font-size:10px;color:#bcb5b0;text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:9px 13px;border-radius:999px}.hero{text-align:center;padding:76px 0 46px}.eyebrow{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:8px 12px;border-radius:999px;color:#c9c3be;font-size:10px}.dot{width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px var(--orange)}h1{font-size:clamp(43px,7vw,74px);line-height:1;letter-spacing:-3px;margin:24px 0 15px}h1 span{background:linear-gradient(90deg,#fff,#c9c0bb);-webkit-background-clip:text;color:transparent}.hero p{max-width:620px;margin:auto;color:var(--muted);font-size:14px;line-height:1.7}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 36px}.category{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,65,25,.025));border-radius:18px;padding:20px;text-align:left;cursor:pointer;transition:.22s}.category:hover,.category.active{border-color:rgba(255,91,50,.55);transform:translateY(-2px);box-shadow:0 15px 40px rgba(0,0,0,.35),0 0 25px rgba(255,62,28,.08)}.category .icon{font-size:22px;margin-bottom:12px}.category b{display:block;font-size:12px}.category small{display:block;color:#777;font-size:9px;margin-top:5px;line-height:1.5}.quiz{border:1px solid rgba(255,255,255,.1);background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,60,25,.025));border-radius:24px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.35);margin-bottom:80px}.quiztop{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.label{font-size:9px;text-transform:uppercase;letter-spacing:1.6px;color:#ff7448}.progress{height:4px;background:#21191b;border-radius:999px;overflow:hidden;margin-bottom:28px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3d24,#ff8a3c);transition:.3s}.question{font-size:25px;line-height:1.25;letter-spacing:-.6px;margin:0 0 22px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;padding:15px 16px;border:1px solid #2a2325;background:#0b0809;color:#ddd;border-radius:14px;cursor:pointer;font:inherit;font-size:12px;transition:.2s}.option:hover{border-color:rgba(255,96,55,.6);background:#120b0d}.option.correct{border-color:rgba(99,211,155,.7);background:rgba(50,160,105,.1);color:#bff1d6}.option.wrong{border-color:rgba(255,70,45,.75);background:rgba(255,55,35,.1);color:#ffc0b7}.feedback{min-height:22px;margin:18px 0 0;font-size:11px;color:#9b9590;line-height:1.6}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}.btn{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);color:#ddd;padding:11px 16px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,#ff7a38,#ff3f20);color:#fff}.result{text-align:center;padding:15px 0}.score{font-size:54px;font-weight:800;letter-spacing:-3px}.result p{color:var(--muted);font-size:12px;line-height:1.6}.hidden{display:none}@media(max-width:800px){.categories{grid-template-columns:repeat(2,1fr)}.quiz{padding:22px}.question{font-size:21px}}@media(max-width:520px){.wrap{width:min(100% - 24px,1100px)}.categories{grid-template-columns:1fr 1fr;gap:8px}.category{padding:14px}.category .icon{font-size:18px}.hero{padding:55px 0 35px}.quiztop{align-items:flex-start}.question{font-size:19px}}
</style></head><body><nav class="nav"><div class="wrap navin"><a class="brand" href="index.html"><img src="peradian-logo.png" alt="Peradian"><span>PERADIAN</span></a><a class="back" href="index.html">← Back to Archive</a></div></nav><main class="wrap"><section class="hero"><div class="eyebrow"><span class="dot"></span> QUICK PRACTICE · ORIGINAL QUESTIONS</div><h1>Test what you <span>know.</span></h1><p>Practice with fresh questions created for Peradian. Choose a category, answer at your own pace, and build your knowledge.</p></section><section class="categories" aria-label="Quiz categories"><button class="category active" data-cat="history"><div class="icon">🏛️</div><b>History</b><small>Empires, events & people</small></button><button class="category" data-cat="science"><div class="icon">⚗️</div><b>Science</b><small>Nature, space & discovery</small></button><button class="category" data-cat="technology"><div class="icon">◈</div><b>Technology</b><small>Digital world & innovation</small></button><button class="category" data-cat="geography"><div class="icon">◎</div><b>Geography</b><small>Places, maps & Earth</small></button><button class="category" data-cat="culture"><div class="icon">🎭</div><b>Culture</b><small>Art, cinema & traditions</small></button><button class="category" data-cat="india"><div class="icon">✦</div><b>India</b><small>History, society & places</small></button><button class="category" data-cat="media"><div class="icon">⌁</div><b>Media Literacy</b><small>Think, verify & question</small></button><button class="category" data-cat="mixed"><div class="icon">✧</div><b>Mixed</b><small>A little of everything</small></button></section><section class="quiz" id="quiz"><div class="quiztop"><span class="label" id="categoryLabel">History</span><span id="counter" style="font-size:10px;color:#777">Question 1 / 5</span></div><div class="progress"><i id="progress"></i></div><div id="questionArea"><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><span id="scoreText" style="font-size:10px;color:#777">Score: 0</span><button class="btn primary" id="next">Next question →</button></div></div><div class="result hidden" id="result"><div class="label">QUIZ COMPLETE</div><div class="score" id="finalScore">0/5</div><p id="resultText"></p><button class="btn primary" id="restart">Practice again ↻</button></div></section></main><script>
const bank={
history:[['Which ancient city is widely associated with the Library of Alexandria?',['Alexandria','Sparta','Carthage','Babylon'],0],['The Magna Carta was sealed in which century?',['11th','13th','15th','17th'],1],['Which civilization built Machu Picchu?',['Maya','Roman','Inca','Phoenician'],2],['The Silk Road primarily connected trade networks across which broad regions?',['Europe and East Asia','Only Africa','Only South America','Australia and Antarctica'],0],['Who was known as the “Iron Chancellor” of Germany?',['Otto von Bismarck','Napoleon III','Metternich','Garibaldi'],0]],
science:[['Which layer of Earth is mostly liquid iron and nickel?',['Crust','Inner core','Outer core','Mantle'],2],['What carries genetic instructions in most living organisms?',['DNA','Starch','Calcium','Chlorophyll'],0],['Which planet has the shortest year in our solar system?',['Mars','Mercury','Venus','Neptune'],1],['What process lets plants convert light energy into chemical energy?',['Fermentation','Photosynthesis','Respiration','Diffusion'],1],['Which force keeps planets in orbit around the Sun?',['Magnetism','Friction','Gravity','Pressure'],2]],
technology:[['What does URL identify on the internet?',['A web address','A processor','A password','A file type'],0],['Which technology is designed to store data without mechanical spinning disks?',['SSD','CRT','VGA','DSL'],0],['What is two-factor authentication mainly intended to improve?',['Screen brightness','Account security','Download speed','Battery life'],1],['Which language is primarily used to structure content on a webpage?',['HTML','SQL','Bash','Swift'],0],['What does a QR code mainly provide?',['A scannable information link','Extra battery power','A stronger Wi‑Fi signal','A camera lens'],0]],
geography:[['Which ocean is the largest on Earth?',['Atlantic','Indian','Pacific','Arctic'],2],['The Andes mountain range runs mainly along which continent?',['Africa','South America','Europe','Asia'],1],['Which country contains the city of Kyoto?',['China','South Korea','Japan','Thailand'],2],['What is the name of the imaginary line at 0° latitude?',['Prime Meridian','Equator','Tropic of Capricorn','International Date Line'],1],['Which desert covers much of northern Africa?',['Gobi','Kalahari','Sahara','Atacama'],2]],
culture:[['Which art form combines spoken words with rhythm and rhyme?',['Poetry','Architecture','Sculpture','Ceramics'],0],['A haiku traditionally comes from which cultural tradition?',['Japanese','Greek','Mayan','Persian'],0],['Which instrument family does the violin belong to?',['Brass','String','Percussion','Woodwind'],1],['What is animation fundamentally made from?',['A sequence of images or frames','Only live audio','A single photograph','A printed newspaper'],0],['Which medium is designed primarily for moving visual storytelling?',['Cinema','Typography','Cartography','Calligraphy'],0]],
india:[['Which Indian city is known as the Pink City?',['Jaipur','Pune','Kochi','Bhopal'],0],['The Konark Sun Temple is in which Indian state?',['Gujarat','Odisha','Punjab','Kerala'],1],['Which mountain range forms much of India’s northern boundary?',['Alps','Andes','Himalayas','Urals'],2],['Which language is primarily associated with Maharashtra?',['Marathi','Gujarati','Assamese','Kashmiri'],0],['The Ajanta Caves are located in which state?',['Maharashtra','Rajasthan','Bihar','Tamil Nadu'],0]],
media:[['What is the best first step when a surprising claim appears online?',['Share it quickly','Check its source and evidence','Trust the headline','Judge it by comments'],1],['A headline designed mainly to trigger curiosity or outrage is often called what?',['Clickbait','Metadata','Encryption','Typography'],0],['Why should an image used as evidence be checked for context?',['It may be old or unrelated','Images never contain information','Context makes files larger','It changes the weather'],0],['What does confirmation bias encourage people to do?',['Seek only evidence supporting existing beliefs','Forget every fact','Avoid all opinions','Use stronger passwords'],0],['What is a primary source?',['First-hand evidence from the time or event','A random social comment','A summary copied from another article','An advertisement'],0]],
mixed:[]};bank.mixed=[...bank.history.slice(0,2),...bank.science.slice(0,1),...bank.india.slice(0,1),...bank.media.slice(0,1)];
const names={history:'History',science:'Science',technology:'Technology',geography:'Geography',culture:'Culture',india:'India',media:'Media Literacy',mixed:'Mixed'};let cat='history',items=[],index=0,score=0,answered=false;
const $=id=>document.getElementById(id);function start(){items=[...bank[cat]];index=0;score=0;answered=false;$('questionArea').classList.remove('hidden');$('result').classList.add('hidden');$('categoryLabel').textContent=names[cat];render()}
function render(){const q=items[index];$('counter').textContent=`Question ${index+1} / ${items.length}`;$('progress').style.width=((index)/items.length*100)+'%';$('question').textContent=q[0];$('feedback').textContent='';$('scoreText').textContent=`Score: ${score}`;answered=false;const box=$('options');box.innerHTML='';q[1].forEach((text,i)=>{const b=document.createElement('button');b.className='option';b.textContent=text;b.onclick=()=>answer(i,b);box.appendChild(b)})}
function answer(i,btn){if(answered)return;answered=true;const q=items[index];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct')});if(i===q[2]){score++;$('feedback').textContent='Correct — nice work.'}else{btn.classList.add('wrong');$('feedback').textContent=`Not quite. The correct answer is “${q[1][q[2]]}”.`}$('scoreText').textContent=`Score: ${score}`}
$('next').onclick=()=>{if(!answered){$('feedback').textContent='Choose an answer first.';return}if(index<items.length-1){index++;render()}else finish()};function finish(){$('questionArea').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=`${score}/${items.length}`;$('progress').style.width='100%';$('resultText').textContent=score===items.length?'Perfect score. You know your stuff.':score>=3?'Strong attempt. Keep practising and sharpen the details.':'Good start. Try another category and build your score.'}$('restart').onclick=start;document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;start();document.getElementById('quiz').scrollIntoView({behavior:'smooth',block:'start'})});start();
</script><script src="peradian-branding.js"></script></body></html>
